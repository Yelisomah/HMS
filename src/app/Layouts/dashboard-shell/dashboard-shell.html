<div class="app-shell">
  <app-sidebar
    [role]="role"
    [userId]="userId"
    [open]="sidebarOpen"
    (closeMenu)="closeSidebar()"
  />
  <div class="shell-main">
    <app-topbar
      [role]="role"
      [email]="email"
      (menuToggle)="toggleSidebar()"
    />
    <main class="shell-content">
      <router-outlet />
    </main>
  </div>
</div>
