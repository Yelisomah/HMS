@if (open) {
  <button
    class="sidebar-scrim"
    type="button"
    aria-label="Close navigation"
    (click)="closeMenu.emit()"
  ></button>
}
<aside class="app-sidebar" [class.sidebar-open]="open" aria-label="Main navigation">
  <a class="brand sidebar-brand" [routerLink]="routeFor('')" (click)="closeMenu.emit()">
    <span class="brand-mark" aria-hidden="true">H</span>
    <span>HMS <span class="brand-subtitle">Health Management</span></span>
  </a>

  <!-- <div class="sidebar-section-label">WORKSPACE</div> -->
  <nav class="sidebar-nav">
    @for (item of visibleItems; track item.path) {
      <a
        class="sidebar-link"
        [routerLink]="routeFor(item.path)"
        routerLinkActive="sidebar-link-active"
        [routerLinkActiveOptions]="{ exact: item.path === '' }"
        (click)="closeMenu.emit()"
      >
        <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-bottom">
    <div class="sidebar-help">
      <span class="help-mark" aria-hidden="true">?</span>
      <div><strong>Need assistance?</strong><span>Contact IT support</span></div>
    </div>
    <!-- <span class="sidebar-version">HMS · Hospital workspace</span> -->
  </div>
</aside>
